<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Google Search Console — Option B (HTML tag). Replace CONTENT with the code from Search Console. -->
<meta name="google-site-verification" content="jDSLpLixrt2HtUDu_5Ao-N-vICyit6tMCqablT30GE0">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sign in | Cashora</title>
<link rel="icon" type="image/webp" href="assets/icons/cashora-icon.webp">
<link rel="icon" type="image/webp" sizes="32x32" href="assets/icons/favicon-32.webp">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.webp">

<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="manifest" href="manifest.json">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4);
    background: radial-gradient(circle at 20% 20%, rgba(59,130,246,0.08), transparent 40%), var(--color-bg-base);
  }
  .auth-card {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: var(--space-5);
  }
  .auth-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-3);
    margin-bottom: var(--space-2);
  }
  .auth-brand-mark {
    width: 40px; height: 40px;
    border-radius: var(--radius-md);
    background: var(--gradient-accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: var(--font-weight-bold);
    color: #05070d;
  }
  .auth-brand-name { font-family: var(--font-display); font-weight: var(--font-weight-bold); font-size: var(--text-xl); }
  .auth-title { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--font-weight-bold); text-align: center; }
  .auth-subtitle { text-align: center; font-size: var(--text-sm); color: var(--color-text-secondary); margin-top: var(--space-1); margin-bottom: var(--space-2); }
  .auth-error {
    background: var(--color-danger-bg);
    color: var(--color-danger);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-4);
    font-size: var(--text-sm);
    display: none;
  }
  .auth-error.is-visible { display: block; }
  .auth-switch { text-align: center; font-size: var(--text-sm); color: var(--color-text-secondary); }
  .auth-switch button { color: var(--color-accent-400); font-weight: var(--font-weight-semibold); }
  #signupNameField, #resetNotice { display: none; }
  .auth-forgot { text-align: right; font-size: var(--text-xs); margin-top: calc(-1 * var(--space-2)); }
  .auth-forgot button { color: var(--color-accent-400); }
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-brand">
    <img class="auth-brand-logo" src="assets/icons/cashora-icon.webp" width="48" height="48" alt="Cashora" />
    <span class="auth-brand-name">Cashora</span>
  </div>

  <div class="card" style="display:flex; flex-direction:column; gap:var(--space-4);">
    <div>
      <h1 class="auth-title" id="authTitle">Welcome back</h1>
      <p class="auth-subtitle" id="authSubtitle">Sign in to see your financial overview.</p>
    </div>

    <div class="auth-error" id="authError"></div>
    <div class="auth-error" id="resetNotice" style="background:var(--color-success-bg,rgba(34,197,94,0.1)); color:var(--color-success); border-color:rgba(34,197,94,0.3);"></div>

    <form id="authForm" style="display:flex; flex-direction:column; gap:var(--space-4);">
      <div class="field" id="signupNameField">
        <label class="field__label" for="nameInput">Full Name</label>
        <input class="input" type="text" id="nameInput" placeholder="Krish Parmar" autocomplete="name">
      </div>
      <div class="field">
        <label class="field__label" for="emailInput">Email Address</label>
        <input class="input" type="email" id="emailInput" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field" id="passwordField">
        <label class="field__label" for="passwordInput">Password</label>
        <input class="input" type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" required>
        <p class="auth-forgot" id="forgotWrap"><button type="button" id="forgotBtn">Forgot password?</button></p>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%; padding: var(--space-3);">Sign In</button>
    </form>

    <p class="auth-switch" id="switchWrap">
      <span id="switchPrompt">Don't have an account?</span>
      <button type="button" id="switchModeBtn">Sign up</button>
    </p>
    <p class="auth-switch" id="backToLoginWrap" style="display:none;">
      <button type="button" id="backToLoginBtn">&larr; Back to sign in</button>
    </p>
  </div>

  <p style="text-align:center; font-size:var(--text-xs); color:var(--color-text-muted);"><a class="krixora-credit" href="https://krixora-portfolio.vercel.app/" target="_blank" rel="noopener noreferrer" title="KRIXORA portfolio">
    <img src="assets/icons/krixora-mark.svg" width="18" height="18" alt="" />
    <strong>KRIXORA</strong>
  </a></p>
</div>

<script type="module">
  import { login, signup, isAuthenticated, requestPasswordReset } from './js/state.js';

  // Already logged in? Skip straight to the dashboard.
  isAuthenticated().then((authed) => {
    if (authed) window.location.href = 'index.html';
  });

  let mode = 'login'; // 'login' | 'signup' | 'reset'

  const authTitle = document.getElementById('authTitle');
  const authSubtitle = document.getElementById('authSubtitle');
  const authError = document.getElementById('authError');
  const resetNotice = document.getElementById('resetNotice');
  const authForm = document.getElementById('authForm');
  const nameField = document.getElementById('signupNameField');
  const passwordField = document.getElementById('passwordField');
  const forgotWrap = document.getElementById('forgotWrap');
  const nameInput = document.getElementById('nameInput');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const submitBtn = document.getElementById('submitBtn');
  const switchWrap = document.getElementById('switchWrap');
  const switchPrompt = document.getElementById('switchPrompt');
  const switchModeBtn = document.getElementById('switchModeBtn');
  const forgotBtn = document.getElementById('forgotBtn');
  const backToLoginWrap = document.getElementById('backToLoginWrap');
  const backToLoginBtn = document.getElementById('backToLoginBtn');

  function setMode(newMode) {
    mode = newMode;
    authError.classList.remove('is-visible');
    resetNotice.classList.remove('is-visible');

    if (mode === 'login') {
      authTitle.textContent = 'Welcome back';
      authSubtitle.textContent = 'Sign in to see your financial overview.';
      nameField.style.display = 'none';
      passwordField.style.display = 'block';
      submitBtn.textContent = 'Sign In';
      switchPrompt.textContent = "Don't have an account?";
      switchModeBtn.textContent = 'Sign up';
      switchWrap.style.display = 'block';
      backToLoginWrap.style.display = 'none';
    } else if (mode === 'signup') {
      authTitle.textContent = 'Create your account';
      authSubtitle.textContent = 'Start tracking your finances in minutes.';
      nameField.style.display = 'flex';
      passwordField.style.display = 'block';
      submitBtn.textContent = 'Create Account';
      switchPrompt.textContent = 'Already have an account?';
      switchModeBtn.textContent = 'Sign in';
      switchWrap.style.display = 'block';
      backToLoginWrap.style.display = 'none';
    } else {
      authTitle.textContent = 'Reset your password';
      authSubtitle.textContent = "Enter your email and we'll send you a reset link.";
      nameField.style.display = 'none';
      passwordField.style.display = 'none';
      submitBtn.textContent = 'Send Reset Link';
      switchWrap.style.display = 'none';
      backToLoginWrap.style.display = 'block';
    }
  }

  switchModeBtn.addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));
  forgotBtn.addEventListener('click', () => setMode('reset'));
  backToLoginBtn.addEventListener('click', () => setMode('login'));

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.classList.remove('is-visible');
    resetNotice.classList.remove('is-visible');

    const email = emailInput.value.trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      authError.textContent = 'Please enter a valid email address.';
      authError.classList.add('is-visible');
      return;
    }

    if (mode === 'reset') {
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      try {
        await requestPasswordReset(email);
        resetNotice.textContent = 'Reset link sent. Check your inbox (and spam folder) for next steps.';
        resetNotice.classList.add('is-visible');
      } catch (err) {
        authError.textContent = err.message || 'Could not send reset link. Please try again.';
        authError.classList.add('is-visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = mode === 'login' ? 'Signing in…' : 'Creating account…';

    try {
      const password = passwordInput.value;
      if (mode === 'login') {
        await login(email, password);
      } else {
        if (!nameInput.value.trim()) throw new Error('Please enter your name.');
        if (password.length < 8) throw new Error('Password must be at least 8 characters.');
        await signup(nameInput.value.trim(), email, password);
      }
      window.location.href = 'index.html';
    } catch (err) {
      authError.textContent = err.message || 'Something went wrong. Please try again.';
      authError.classList.add('is-visible');
      submitBtn.disabled = false;
      submitBtn.textContent = mode === 'login' ? 'Sign In' : 'Create Account';
    }
  });
</script>

</body>
</html>
