<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Google Search Console — Option B (HTML tag). Replace CONTENT with the code from Search Console. -->

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset Password | Cashora</title>
<link rel="icon" type="image/webp" href="assets/icons/cashora-icon.webp">
<link rel="icon" type="image/webp" sizes="32x32" href="assets/icons/favicon-32.webp">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.webp">

<meta name="theme-color" content="#05070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<link rel="manifest" href="manifest.json">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4);
    background: radial-gradient(circle at 20% 20%, rgba(59,130,246,0.08), transparent 40%), var(--color-bg-base);
  }
  .auth-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: var(--space-5); }
  .auth-brand { display: flex; align-items: center; justify-content: center; gap: var(--space-3); margin-bottom: var(--space-2); }
  .auth-brand-mark {
    width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--gradient-accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: var(--font-weight-bold); color: #05070d;
  }
  .auth-brand-name { font-family: var(--font-display); font-weight: var(--font-weight-bold); font-size: var(--text-xl); }
  .auth-title { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--font-weight-bold); text-align: center; }
  .auth-subtitle { text-align: center; font-size: var(--text-sm); color: var(--color-text-secondary); margin-top: var(--space-1); margin-bottom: var(--space-2); }
  .auth-error {
    background: var(--color-danger-bg); color: var(--color-danger); border: 1px solid rgba(239,68,68,0.3);
    border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: var(--text-sm); display: none;
  }
  .auth-error.is-visible { display: block; }
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-brand">
    <img class="auth-brand-logo" src="assets/icons/cashora-icon.webp" width="48" height="48" alt="Cashora" />
    <span class="auth-brand-name">Cashora</span>
  </div>

  <div class="card" style="display:flex; flex-direction:column; gap:var(--space-4);">
    <div>
      <h1 class="auth-title">Set a new password</h1>
      <p class="auth-subtitle" id="subtitle">Choose a new password for your account.</p>
    </div>

    <div class="auth-error" id="authError"></div>

    <form id="resetForm" style="display:flex; flex-direction:column; gap:var(--space-4);">
      <div class="field">
        <label class="field__label" for="passwordInput">New Password</label>
        <input class="input" type="password" id="passwordInput" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label class="field__label" for="confirmInput">Confirm Password</label>
        <input class="input" type="password" id="confirmInput" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%; padding: var(--space-3);">Update Password</button>
    </form>
  </div>

  <p style="text-align:center; font-size:var(--text-xs); color:var(--color-text-muted);"><a class="krixora-credit" href="https://krixora-portfolio.vercel.app/" target="_blank" rel="noopener noreferrer" title="KRIXORA portfolio">
    <img src="assets/icons/krixora-mark.svg" width="18" height="18" alt="" />
    <strong>KRIXORA</strong>
  </a></p>
</div>

<script type="module">
  import { isAuthenticated, updatePassword } from './js/state.js';

  const form = document.getElementById('resetForm');
  const passwordInput = document.getElementById('passwordInput');
  const confirmInput = document.getElementById('confirmInput');
  const submitBtn = document.getElementById('submitBtn');
  const authError = document.getElementById('authError');
  const subtitle = document.getElementById('subtitle');

  // Supabase's reset link signs the browser into a temporary "recovery" session.
  // If that session isn't present, this page was opened without a valid link.
  isAuthenticated().then((authed) => {
    if (!authed) {
      subtitle.textContent = 'This reset link is invalid or has expired.';
      form.style.display = 'none';
      authError.textContent = 'Please request a new password reset link from the sign-in page.';
      authError.classList.add('is-visible');
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.classList.remove('is-visible');

    const password = passwordInput.value;
    const confirm = confirmInput.value;

    if (password.length < 8) {
      authError.textContent = 'Password must be at least 8 characters.';
      authError.classList.add('is-visible');
      return;
    }
    if (password !== confirm) {
      authError.textContent = 'Passwords do not match.';
      authError.classList.add('is-visible');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating…';
    try {
      await updatePassword(password);
      subtitle.textContent = 'Password updated. Redirecting you to your dashboard…';
      form.style.display = 'none';
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    } catch (err) {
      authError.textContent = err.message || 'Could not update password. Please try again.';
      authError.classList.add('is-visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';
    }
  });
</script>

</body>
</html>
